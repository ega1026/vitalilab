<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaliLab - Iniciar Sesión</title>
    <!-- CSS Principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') if url_for else 'style.css' }}">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logovitalilab.png') }}" alt="Logo VitaliLab" class="logo-img">
            <h1>VitaliLab</h1>
        </div>
        <nav>
            <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="{{ url_for('login') }}" class="active"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</a>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
            <h2><i class="fa-solid fa-user-lock" style="color: #007bff;"></i> Iniciar Sesión</h2>
            <p style="margin-bottom: 20px; color: #555;">Ingresa tu nombre de usuario para acceder a tu perfil de salud.</p>
            
            {% if error %}
            <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9rem;">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                    <label for="nombre" style="font-weight: bold; font-size: 0.9rem;"><i class="fa-solid fa-user"></i> Nombre de Usuario:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Juan Pérez" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 10px; cursor: pointer;"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
