<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logovitalilab.png" type="image/png">
  <title>Iniciar Sesion – VitaliLab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="login-pagina">
    <div class="login-caja">

      <div class="login-logo">VitaliLab</div>

      <h1 style="font-size: 24px; text-align: center; margin-top: 0;">Iniciar sesion</h1>
      <p style="text-align: center; margin-bottom: 20px;">Ingresa tus datos para acceder al sistema.</p>

      <div class="error-msg" id="error-msg">
        Usuario o contraseña incorrectos.
      </div>
      <div class="exito-msg" id="exito-msg">
        ¡Bienvenido/a! Redirigiendo…
      </div>

      <form action="/verificar_login" method="POST">
        <div class="campo-grupo">
          <label for="correo">Correo electronico</label>
          <input type="email" id="correo" name="correo" placeholder="Ej: correo@institucion.edu.co" required />
        </div>

        <div class="campo-grupo" style="margin-top: 15px;">
          <label for="contrasena">Contrasena</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required />
        </div>

        <br>
        <button type="submit" class="btn-verde">Ingresar</button>
      </form>

      <p class="login-registro">
        ¿No tienes cuenta? <a href="perfil.html">Registrate aquí</a> | <a href="index.html">Volver al inicio</a>
      </p>

    </div>
  </div>

</body>
</html>
