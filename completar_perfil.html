<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaliLab - Completar Perfil</title>
    <!-- CSS Principal -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') if url_for else 'style.css' }}">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para alertas modernas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logovitalilab.png') }}" alt="Logo VitaliLab" class="logo-img">
            <h1>VitaliLab</h1>
        </div>
        <nav>
            <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="{{ url_for('logout') }}"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        </nav>
    </header>

    <main class="container">
        <div class="card" style="max-width: 450px; margin: 40px auto; text-align: center;">
            <h2><i class="fa-solid fa-user-pen" style="color: #007bff;"></i> Completa tu Perfil</h2>
            <p style="margin-bottom: 20px; color: #555;">Proporciona tus datos para personalizar tu experiencia en VitaliLab.</p>

            <form method="POST" action="{{ url_for('completar_perfil') if url_for else '#' }}">
                <div class="form-group" style="margin-bottom: 15px; text-align: left;">
                    <label for="edad" style="font-weight: bold; font-size: 0.9rem;"><i class="fa-solid fa-cake-candles"></i> Edad:</label>
                    <input type="number" id="edad" name="edad" required placeholder="Ej. 16" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin-bottom: 20px; text-align: left;">
                    <label for="grado" style="font-weight: bold; font-size: 0.9rem;"><i class="fa-solid fa-graduation-cap"></i> Grado / Grupo:</label>
                    <input type="text" id="grado" name="grado" required placeholder="Ej. 5° Semestre A" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; padding: 10px; cursor: pointer;"><i class="fa-solid fa-floppy-disk"></i> Guardar Datos</button>
            </form>
        </div>
    </main>
</body>
</html>
