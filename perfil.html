<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logovitalilab.png" type="image/png">
    <title>Mi Perfil - VitaliLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <div class="logo">🌿 VitaliLab</div>
        <nav>
          <a href="index.html">Inicio</a>
          <a href="perfil.html" class="activo">Mi Perfil</a>
          <a href="login.html">Ingresar</a>
        </nav>
    </header>

    <div class="contenedor">
        <h1>Mi Perfil Estudiantil</h1>
        <p>Completa tus datos para que el sistema calcule tu IMC y configure tu plan de bienestar.</p>

        <form action="/registrar_perfil" method="POST">
            
            <h3>Datos del estudiante</h3>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Laura Martínez" required>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Ej: 14" required>

            <label for="grado">Grado:</label>
            <select id="grado" name="grado" required>
                <option value="">Seleccionar...</option>
                <option value="6">Sexto</option>
                <option value="7">Séptimo</option>
                <option value="8">Octavo</option>
                <option value="9">Noveno</option>
                <option value="10">Décimo</option>
                <option value="11">Once</option>
            </select>

            <h3>Medidas biométricas</h3>

            <label for="peso">Peso (en kilogramos):</label>
            <input type="number" step="0.1" id="peso" name="peso" placeholder="Ej: 60.5" required>

            <label for="altura">Altura (en centímetros):</label>
            <input type="number" id="altura" name="altura" placeholder="Ej: 170" required>

            <h3>Hidratación diaria</h3>

            <label for="vasos">¿Cuántos vasos de agua has tomado hoy?</label>
            <input type="number" id="vasos" name="vasos" placeholder="Ej: 6" required>

            <br>
            <button type="submit" class="btn-verde">Guardar perfil</button>

        </form>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p>
          <strong>VitaliLab</strong> &nbsp;·&nbsp;
          Proyecto Productivo de Grado &nbsp;·&nbsp;
          Media Técnica en Programación
        </p>
    </footer>

</body>
</html>
