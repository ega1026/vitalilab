<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="logovitalilab.png" type="image/png">
    <title>Registro - VitaliLab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header>
        <div class="logo">VitaliLab</div>
        <nav>
          <a href="index.html">Inicio</a>
          <a href="perfil.html" class="activo">Registrarse</a>
          <a href="login.html">Ingresar</a>
        </nav>
    </header>

    <div class="contenedor">
        <h1>Crear Cuenta</h1>
        <p>Regístrate para empezar a llevar el control de tus hábitos saludables.</p>

        <form action="/registrar_usuario" method="POST">
            
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Laura Martínez" required>

            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" placeholder="Ej: estudiante@institucion.edu.co" required>
            
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>

            <br><br>
            <button type="submit" class="btn-verde">Crear cuenta</button>

        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
            ¿Ya tienes una cuenta? <a href="login.html" style="color: #3498db; font-weight: bold; text-decoration: none;">Inicia sesión aquí</a>
        </p>
    </div>

</body>
</html>
