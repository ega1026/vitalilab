<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - VitaliLab</title>
    <link rel="icon" href="{{ url_for('static', filename='logovitalilab.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='logovitalilab.png') }}" alt="Logo VitaliLab" class="logo-img">
            <h1>VitaliLab</h1>
        </div>
        <nav>
            <a href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i> Inicio</a>
            <a href="{{ url_for('logout') }}" style="color: #ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
        </nav>
    </header>

    <main class="container" style="max-width: 800px; margin-top: 30px;">
        <section class="card-welcome" style="text-align: left; margin-bottom: 20px;">
            <h2><i class="fa-solid fa-user-shield" style="color: #10b981;"></i> ¡Hola, {{ usuario.nombre }}!</h2>
            <p>Bienvenido a tu panel de control de hábitos y rachas comunitarias.</p>
            <div style="display: flex; gap: 20px; margin-top: 15px;">
                <p> <strong>Racha:</strong> {{ usuario.racha }} Días</p>
                <p> <strong>Puntos XP:</strong> {{ usuario.puntos }}</p>
            </div>
        </section>

        <div class="card" style="text-align: left;">
            <h3><i class="fa-solid fa-list-check" style="color: #0ea5e9;"></i> Checklist de Hábitos Diarios</h3>
            <p style="margin-bottom: 20px; color: #64748b;">Marca tus metas cumplidas hoy para sumar puntos y mantener tu racha activa:</p>
            
            <form action="{{ url_for('actualizar_retos') }}" method="POST">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" name="agua" value="1" style="width: 18px; height: 18px;">  Beber al menos 2 litros de agua
                    </label>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" name="dormir" value="1" style="width: 18px; height: 18px;">  Dormir entre 7 y 8 horas reparadoras
                    </label>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" name="entrenamiento" value="1" style="width: 18px; height: 18px;">  Cumplir con tu entrenamiento o pausas activas
                    </label>
                </div>
                <button type="submit" class="btn-success" style="width: 100%;"><i class="fa-solid fa-floppy-disk"></i> Guardar y Actualizar Progreso</button>
            </form>
        </div>
    </main>
</body>
</html>
