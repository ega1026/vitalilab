<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - VitaliLab</title>
    <link rel="icon" href="{{ url_for('static', filename='logovitalilab.png') }}" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">
    <header class="bg-white shadow-sm py-4 px-6 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="{{ url_for('static', filename='logovitalilab.png') }}" alt="Logo" class="w-10 h-10 object-contain">
            <span class="text-xl font-bold text-slate-800">VitaliLab</span>
        </div>
        <a href="{{ url_for('index') }}" class="text-slate-600 hover:text-emerald-600 font-medium flex items-center gap-2"><i class="fa-solid fa-house"></i> Inicio</a>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10 w-full grid md:grid-cols-2 gap-8 items-start">
        <!-- Iniciar Sesión -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Iniciar Sesión</h2>
            </div>
            
            {% if error %}
            <div class="bg-red-50 text-red-700 p-3 rounded-xl mb-4 text-sm font-medium border border-red-100">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Correo electrónico</label>
                    <input type="email" name="correo" placeholder="tucorreo@ejemplo.com" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" name="contrasena" placeholder="••••••••" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-slate-700 text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md shadow-emerald-600/20 text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar a mi cuenta
                </button>
            </form>
        </div>

        <!-- Únete a la Comunidad -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Únete a la Comunidad</h2>
            </div>

            <form action="{{ url_for('registro') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nombre o Apodo</label>
                    <input type="text" name="nombre" placeholder="Ej. Carlos Vital" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Correo electrónico</label>
                    <input type="email" name="correo" placeholder="tucorreo@ejemplo.com" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
                    <input type="password" name="contrasena" placeholder="Crea una contraseña segura" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-700 text-sm">
                </div>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-3 rounded-xl transition-all shadow-md shadow-sky-600/20 text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-check"></i> Registrarse gratis
                </button>
            </form>
        </div>
    </main>

    <footer class="text-center py-6 text-slate-400 text-xs">
        VitaliLab &copy; 2026 - Plataforma Comunitaria de Bienestar
    </footer>
</body>
</html>
