<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>VitaliLab - Iniciar Sesión / Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logovitalilab.png') }}" alt="Logo VitaliLab" width="120">
            <h2 class="mt-2">Bienvenido a VitaliLab</h2>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="row justify-content-center">
            <!-- Formulario de Inicio de Sesión -->
            <div class="col-md-5 mb-4">
                <div class="vitalilab-card h-100">
                    <h4 class="mb-3 text-center">Iniciar Sesión</h4>
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="login-email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="login-password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-vitalilab w-100">Entrar</button>
                    </form>
                </div>
            </div>

            <!-- Formulario de Registro -->
            <div class="col-md-5 mb-4">
                <div class="vitalilab-card h-100">
                    <h4 class="mb-3 text-center">Crear Cuenta Nueva</h4>
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-email" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="register-email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="register-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="register-password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100">Registrarme</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
