<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - VitaliLab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        
        {% if error %}
        <div style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            {{ error }}
        </div>
        {% endif %}

        <!-- Formulario de Inicio de Sesión -->
        <div class="card" style="margin-bottom: 20px;">
            <form action="{{ url_for('login') }}" method="POST">
                <h3>Iniciar Sesión</h3>
                <div class="form-group" style="margin: 15px 0;">
                    <input type="email" name="correo" placeholder="Correo electrónico" required style="width: 100%; padding: 10px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="password" name="contrasena" placeholder="Contraseña" required style="width: 100%; padding: 10px;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
            </form>
        </div>

        <!-- Formulario de Registro General -->
        <div class="card">
            <form action="{{ url_for('registro') }}" method="POST">
                <h3>Únete a la Comunidad</h3>
                <div class="form-group" style="margin: 15px 0;">
                    <input type="text" name="nombre" placeholder="Nombre real o apodo de perfil" required style="width: 100%; padding: 10px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="email" name="correo" placeholder="Correo electrónico" required style="width: 100%; padding: 10px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="password" name="contrasena" placeholder="Crea una contraseña" required style="width: 100%; padding: 10px;">
                </div>
                <button type="submit" class="btn-success" style="width: 100%;">Registrarse</button>
            </form>
        </div>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('index') }}">← Volver al inicio</a>
        </p>
    </div>
</body>
</html>
